<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard-Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="items logo" >
            <h1 class="heading">LOGO</h1>
            <p class="para">🏠 Dashboard</p>
            <p class="para">📦 Products</p>
            <p class="para">👥 Users</p>
            <p class="para">📈 Analytics</p>
            <p class="para">⚙️ Settings</p>
        </div>
        <div class="items main">
            <h1 class="heading1">Dashboard</h1>
            <button>Logout</button>
            <div class="container1">
                <div class="box1 item1 effect">
                    <h3>Users</h3>
                    <p class="para1">12,540</p>
                </div>
                <div class="box1 item2 effect">
                    <h3>Sales</h3>
                    <p class="para1">₹2.5L</p>
                </div>
                <div class="box1 item3 effect">
                    <h3>Orders</h3>
                    <p class="para1">1,200</p>
                </div>
                <div class="box1 item4">
                    Sales Overview
                </div>
            </div>
        </div>
    </div>
</body>
</html>
